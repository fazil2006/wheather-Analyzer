<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vibe Weather Analyzer</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      min-height:100vh;
      overflow:hidden;
      background:#070b17;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      color:white;
    }

    /* Animated Background */
    body::before{
      content:'';
      position:absolute;
      width:800px;
      height:800px;
      background:radial-gradient(circle,#5f2cff55,#ff2cf055,transparent 70%);
      animation:moveGlow 8s infinite alternate ease-in-out;
      filter:blur(80px);
    }

    body::after{
      content:'';
      position:absolute;
      width:600px;
      height:600px;
      background:radial-gradient(circle,#00c3ff55,#00ff9555,transparent 70%);
      right:-100px;
      bottom:-100px;
      animation:moveGlow2 10s infinite alternate ease-in-out;
      filter:blur(90px);
    }

    @keyframes moveGlow{
      from{
        transform:translate(-100px,-100px);
      }
      to{
        transform:translate(120px,80px);
      }
    }

    @keyframes moveGlow2{
      from{
        transform:translate(0,0);
      }
      to{
        transform:translate(-120px,-80px);
      }
    }

    .container{
      width:420px;
      padding:35px;
      border-radius:30px;
      background:rgba(255,255,255,0.08);
      backdrop-filter:blur(25px);
      border:1px solid rgba(255,255,255,0.12);
      box-shadow:
      0 8px 32px rgba(0,0,0,0.4),
      inset 0 0 20px rgba(255,255,255,0.05);
      position:relative;
      z-index:2;
      overflow:hidden;
    }

    .container::before{
      content:'';
      position:absolute;
      inset:0;
      background:linear-gradient(
        135deg,
        rgba(255,255,255,0.08),
        transparent,
        rgba(255,255,255,0.03)
      );
      pointer-events:none;
    }

    .title{
      text-align:center;
      font-size:2rem;
      font-weight:700;
      margin-bottom:25px;
      letter-spacing:1px;
      background:linear-gradient(90deg,#ffffff,#b89cff,#7df9ff);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .search-box{
      display:flex;
      gap:10px;
      margin-bottom:25px;
    }

    .search-box input{
      flex:1;
      padding:14px 18px;
      border:none;
      outline:none;
      border-radius:18px;
      background:rgba(255,255,255,0.08);
      color:white;
      font-size:15px;
      backdrop-filter:blur(10px);
      transition:0.3s;
    }

    .search-box input:focus{
      transform:scale(1.02);
      background:rgba(255,255,255,0.12);
      box-shadow:0 0 20px rgba(0,255,255,0.3);
    }

    .search-box button{
      padding:14px 18px;
      border:none;
      border-radius:18px;
      cursor:pointer;
      background:linear-gradient(135deg,#7b2ff7,#f107a3);
      color:white;
      font-weight:600;
      transition:0.3s;
      box-shadow:0 4px 20px rgba(255,0,170,0.4);
    }

    .search-box button:hover{
      transform:translateY(-3px) scale(1.05);
      box-shadow:0 6px 30px rgba(255,0,170,0.6);
    }

    .weather-card{
      text-align:center;
      padding:25px;
      border-radius:25px;
      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.08);
      backdrop-filter:blur(10px);
      animation:fadeIn 1s ease;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .weather-icon{
      font-size:80px;
      margin-bottom:10px;
      animation:float 3s infinite ease-in-out;
    }

    @keyframes float{
      0%,100%{
        transform:translateY(0);
      }
      50%{
        transform:translateY(-10px);
      }
    }

    .city{
      font-size:2rem;
      font-weight:600;
    }

    .temp{
      font-size:4rem;
      font-weight:700;
      margin:10px 0;
      background:linear-gradient(90deg,#fff,#7df9ff);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .desc{
      font-size:1.1rem;
      color:#ddd;
      margin-bottom:25px;
    }

    .details{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:15px;
    }

    .detail-box{
      padding:18px;
      border-radius:18px;
      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.05);
      transition:0.3s;
    }

    .detail-box:hover{
      transform:translateY(-5px);
      background:rgba(255,255,255,0.1);
    }

    .detail-title{
      font-size:13px;
      color:#aaa;
      margin-bottom:6px;
    }

    .detail-value{
      font-size:1.2rem;
      font-weight:600;
    }

    .footer{
      margin-top:20px;
      text-align:center;
      color:#999;
      font-size:12px;
      letter-spacing:1px;
    }

    @media(max-width:480px){
      .container{
        width:92%;
        padding:25px;
      }

      .temp{
        font-size:3rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="title">
      🌤 VIBE WEATHER
    </div>

    <div class="search-box">
      <input type="text" id="cityInput" placeholder="Enter your city...">
      <button onclick="getWeather()">Search</button>
    </div>

    <div class="weather-card">

      <div class="weather-icon">
        ☀️
      </div>

      <div class="city" id="cityName">
        Chennai
      </div>

      <div class="temp" id="temperature">
        32°C
      </div>

      <div class="desc" id="description">
        Sunny Vibes
      </div>

      <div class="details">

        <div class="detail-box">
          <div class="detail-title">
            Humidity
          </div>
          <div class="detail-value" id="humidity">
            60%
          </div>
        </div>

        <div class="detail-box">
          <div class="detail-title">
            Wind
          </div>
          <div class="detail-value" id="wind">
            12 km/h
          </div>
        </div>

        <div class="detail-box">
          <div class="detail-title">
            Feels Like
          </div>
          <div class="detail-value" id="feels">
            35°C
          </div>
        </div>

        <div class="detail-box">
          <div class="detail-title">
            Pressure
          </div>
          <div class="detail-value" id="pressure">
            1012 hPa
          </div>
        </div>

      </div>

    </div>

    <div class="footer">
      Cinematic GenZ Weather UI ✨
    </div>

  </div>

  <script>
    async function getWeather(){

      const city = document.getElementById("cityInput").value;

      if(city === ""){
        alert("Please enter a city name");
        return;
      }

      // Demo random data (Replace with API)
      const temps = [22, 26, 30, 34, 28];
      const descs = ["Cloudy Mood ☁️", "Sunny Vibes ☀️", "Rain Energy 🌧️", "Storm Mode ⛈️"];

      const randomTemp = temps[Math.floor(Math.random()*temps.length)];
      const randomDesc = descs[Math.floor(Math.random()*descs.length)];

      document.getElementById("cityName").innerText = city;
      document.getElementById("temperature").innerText = randomTemp + "°C";
      document.getElementById("description").innerText = randomDesc;

      document.getElementById("humidity").innerText =
        Math.floor(Math.random()*40 + 40) + "%";

      document.getElementById("wind").innerText =
        Math.floor(Math.random()*20 + 5) + " km/h";

      document.getElementById("feels").innerText =
        (randomTemp + 2) + "°C";

      document.getElementById("pressure").innerText =
        Math.floor(Math.random()*20 + 1000) + " hPa";
    }
  </script>

</body>
</html>
